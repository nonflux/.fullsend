name: Setup GCP
description: Authenticate to Google Cloud, mask credentials, and prepare sandbox credentials

inputs:
  gcp_auth_mode:
    description: 'GCP authentication mode: "wif" or "sa-key"'
    required: true
  gcp_wif_provider:
    description: 'Workload Identity Federation provider (required if gcp_auth_mode is "wif")'
    required: false
  gcp_project_id:
    description: 'GCP project ID — embeds quota_project_id in WIF credentials to avoid cloudresourcemanager.projects.get calls'
    required: false
  gcp_sa_key_json:
    description: 'Service account key JSON (required if gcp_auth_mode is not "wif")'
    required: false

runs:
  using: composite
  steps:
    - name: Pre-mask GCP credential file path
      shell: bash
      run: echo "::add-mask::${GITHUB_WORKSPACE}/gha-creds-"

    - name: Authenticate to Google Cloud (WIF)
      if: inputs.gcp_auth_mode == 'wif'
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.gcp_wif_provider }}
        project_id: ${{ inputs.gcp_project_id }}

    - name: Authenticate to Google Cloud (SA key)
      if: inputs.gcp_auth_mode != 'wif'
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.gcp_sa_key_json }}

    # GCP_OIDC_TOKEN_FILE is expected by google-github-actions/auth when using
    # WIF. For non-WIF (SA key), we set it to an empty file to avoid undefined
    # variable errors in downstream steps that may reference it.
    - name: Set GCP_OIDC_TOKEN_FILE for non-WIF
      if: inputs.gcp_auth_mode != 'wif'
      shell: bash
      run: |
        touch "$RUNNER_TEMP/empty-oidc-token"
        echo "GCP_OIDC_TOKEN_FILE=$RUNNER_TEMP/empty-oidc-token" >> "${GITHUB_ENV}"

    - name: Mask GCP credential file paths
      shell: bash
      run: |
        for var in GOOGLE_GHA_CREDS_PATH GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; do
          val="${!var:-}"
          if [[ -n "${val}" ]]; then
            echo "::add-mask::${val}"
          fi
        done

    - name: Prepare sandbox credentials
      shell: bash
      run: bash scripts/prepare-sandbox-credentials.sh

    - name: Debug WIF — decode OIDC JWT and test Vertex AI
      if: inputs.gcp_auth_mode == 'wif'
      shell: bash
      run: |
        set +e
        pip install -q google-auth requests 2>/dev/null

        echo "=== OIDC JWT claims ==="
        OIDC_TOKEN_FILE="$RUNNER_TEMP/gcp-oidc-token"
        if [[ -f "$OIDC_TOKEN_FILE" ]]; then
          JWT=$(jq -r '.value' "$OIDC_TOKEN_FILE" 2>/dev/null || cat "$OIDC_TOKEN_FILE")
          PAYLOAD=$(echo "$JWT" | cut -d. -f2 | tr '_-' '/+' | fold -w 4 | sed '$ s/$/====/' | tr -d '\n' | base64 -d 2>/dev/null)
          echo "$PAYLOAD" | jq '{iss, aud, sub, repository, repository_owner, job_workflow_ref, ref, event_name}' 2>/dev/null || echo "decode failed"
        fi

        echo ""
        echo "=== Credential file structure (no secrets) ==="
        ORIG_CREDS="${GOOGLE_GHA_CREDS_PATH:-$CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}"
        jq '{type, audience, subject_token_type, token_url,
             service_account_impersonation_url,
             has_quota_project: (.quota_project_id != null),
             credential_source_type: .credential_source.url[:50]}' "$ORIG_CREDS" 2>/dev/null

        echo ""
        echo "=== Test 1: Vertex AI WITHOUT x-goog-user-project header ==="
        GOOGLE_APPLICATION_CREDENTIALS="$ORIG_CREDS" python3 -c "
        import google.auth, google.auth.transport.requests, urllib.request, json
        creds, project = google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform'])
        creds.refresh(google.auth.transport.requests.Request())
        print(f'Cred type: {type(creds).__name__}')
        print(f'Project: {project}')
        url = f'https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/anthropic/models/claude-haiku-4-5:streamRawPredict'
        req = urllib.request.Request(url, method='POST',
            data=json.dumps({'anthropic_version':'vertex-2023-10-16','max_tokens':10,'messages':[{'role':'user','content':'hi'}]}).encode(),
            headers={'Authorization': f'Bearer {creds.token}', 'Content-Type': 'application/json'})
        try:
            resp = urllib.request.urlopen(req)
            print(f'Vertex AI: {resp.status} OK')
        except urllib.error.HTTPError as e:
            print(f'Vertex AI: {e.code}')
            print(e.read().decode()[:300])
        "

        echo ""
        echo "=== Test 2: Vertex AI WITH x-goog-user-project header ==="
        GOOGLE_APPLICATION_CREDENTIALS="$ORIG_CREDS" python3 -c "
        import google.auth, google.auth.transport.requests, urllib.request, json
        creds, project = google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform'])
        creds.refresh(google.auth.transport.requests.Request())
        url = f'https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/anthropic/models/claude-haiku-4-5:streamRawPredict'
        req = urllib.request.Request(url, method='POST',
            data=json.dumps({'anthropic_version':'vertex-2023-10-16','max_tokens':10,'messages':[{'role':'user','content':'hi'}]}).encode(),
            headers={'Authorization': f'Bearer {creds.token}', 'Content-Type': 'application/json', 'x-goog-user-project': project})
        try:
            resp = urllib.request.urlopen(req)
            print(f'Vertex AI: {resp.status} OK')
        except urllib.error.HTTPError as e:
            print(f'Vertex AI: {e.code}')
            print(e.read().decode()[:300])
        "

        echo ""
        echo "=== Test 3: Vertex AI with quota_project_id injected into cred file ==="
        PATCHED_CREDS="$RUNNER_TEMP/patched-gcp-credentials.json"
        PROJECT="${GOOGLE_CLOUD_PROJECT:-}"
        jq --arg qp "$PROJECT" '. + {quota_project_id: $qp}' "$ORIG_CREDS" > "$PATCHED_CREDS"
        GOOGLE_APPLICATION_CREDENTIALS="$PATCHED_CREDS" python3 -c "
        import google.auth, google.auth.transport.requests, urllib.request, json
        creds, project = google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform'])
        creds.refresh(google.auth.transport.requests.Request())
        print(f'Cred type: {type(creds).__name__}')
        print(f'quota_project: {getattr(creds, \"quota_project_id\", \"N/A\")}')
        url = f'https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/anthropic/models/claude-haiku-4-5:streamRawPredict'
        req = urllib.request.Request(url, method='POST',
            data=json.dumps({'anthropic_version':'vertex-2023-10-16','max_tokens':10,'messages':[{'role':'user','content':'hi'}]}).encode(),
            headers={'Authorization': f'Bearer {creds.token}', 'Content-Type': 'application/json', 'x-goog-user-project': project})
        try:
            resp = urllib.request.urlopen(req)
            print(f'Vertex AI: {resp.status} OK')
        except urllib.error.HTTPError as e:
            print(f'Vertex AI: {e.code}')
            print(e.read().decode()[:300])
        "

        echo ""
        echo "=== Test 4: Simple API — list Vertex AI models (confirms IAM works at all) ==="
        GOOGLE_APPLICATION_CREDENTIALS="$ORIG_CREDS" python3 -c "
        import google.auth, google.auth.transport.requests, urllib.request, json
        creds, project = google.auth.default(scopes=['https://www.googleapis.com/auth/cloud-platform'])
        creds.refresh(google.auth.transport.requests.Request())
        url = f'https://aiplatform.googleapis.com/v1/projects/{project}/locations/global/publishers/anthropic/models'
        req = urllib.request.Request(url, headers={'Authorization': f'Bearer {creds.token}'})
        try:
            resp = urllib.request.urlopen(req)
            print(f'List models: {resp.status} OK')
        except urllib.error.HTTPError as e:
            print(f'List models: {e.code}')
            print(e.read().decode()[:200])
        "
