name: Triage

on:
  workflow_dispatch:
    inputs:
      event_type:
        required: true
        type: string
      source_repo:
        required: true
        type: string
      event_payload:
        required: true
        type: string

jobs:
  triage:
    uses: fullsend-ai/fullsend/.github/workflows/reusable-triage.yml@d3e913467e4ee7f945dc64f2f472f19a4bbab2d7
    with:
      event_type: ${{ inputs.event_type }}
      source_repo: ${{ inputs.source_repo }}
      event_payload: ${{ inputs.event_payload }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_auth_mode: wif
      gcp_region: global
    secrets: inherit
