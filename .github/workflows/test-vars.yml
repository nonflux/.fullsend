name: Test Vars
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check vars
        env:
          MINT: ${{ vars.FULLSEND_MINT_URL }}
          TEST: ${{ vars.FULLSEND_TEST_VAR }}
        run: |
          echo "MINT length: ${#MINT}"
          echo "TEST value: $TEST"
          echo "TEST length: ${#TEST}"
